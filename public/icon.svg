<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Mountain Peaks in Background -->
  <polygon points="120,340 220,190 320,340" fill="#334155" opacity="0.6" />
  <polygon points="220,190 260,250 200,250" fill="#f8fafc" opacity="0.9" />

  <polygon points="260,350 370,170 480,350" fill="#475569" opacity="0.7" />
  <polygon points="370,170 415,240 330,240" fill="#f8fafc" opacity="0.95" />

  <!-- Rising Winter Sun -->
  <circle cx="150" cy="160" r="44" fill="#fde047" opacity="0.9" filter="url(#shadow)" />

  <!-- Rolling Snow Hills in Foreground -->
  <path d="M 0,340 Q 140,290 280,330 T 512,320 L 512,512 L 0,512 Z" fill="url(#snowGrad)" />
  <path d="M 0,390 Q 180,340 360,380 T 512,360 L 512,512 L 0,512 Z" fill="#ffffff" />

  <!-- Falling Snowflakes -->
  <circle cx="80" cy="90" r="7" fill="#ffffff" opacity="0.8" />
  <circle cx="390" cy="100" r="9" fill="#ffffff" opacity="0.85" />
  <circle cx="440" cy="220" r="6" fill="#ffffff" opacity="0.75" />
  <circle cx="180" cy="280" r="8" fill="#ffffff" opacity="0.9" />
  <circle cx="290" cy="120" r="6" fill="#ffffff" opacity="0.7" />

  <!-- Plow Truck Group -->
  <g transform="translate(130, 290)" filter="url(#shadow)">
    <!-- Truck Shadow -->
    <ellipse cx="130" cy="140" rx="140" ry="24" fill="#0f172a" opacity="0.5" />

    <!-- Truck Wheels -->
    <circle cx="60" cy="125" r="28" fill="#0f172a" />
    <circle cx="60" cy="125" r="14" fill="#94a3b8" />
    <circle cx="180" cy="125" r="28" fill="#0f172a" />
    <circle cx="180" cy="125" r="14" fill="#94a3b8" />

    <!-- Truck Bed & Cab -->
    <rect x="30" y="55" width="100" height="55" rx="8" fill="url(#truckGrad)" />
    <path d="M 120,55 L 175,55 L 205,85 L 205,110 L 120,110 Z" fill="url(#truckGrad)" />
    <!-- Cab Window -->
    <polygon points="135,62 170,62 192,85 135,85" fill="#38bdf8" opacity="0.85" />

    <!-- Warning Roof Flasher -->
    <rect x="145" y="44" width="20" height="11" rx="4" fill="#facc15" />

    <!-- Angled Snowplow Blade in Front -->
    <path d="M 215,75 L 245,70 L 255,130 L 210,135 Z" fill="url(#bladeGrad)" stroke="#64748b" stroke-width="4" />
    <polygon points="215,75 245,70 235,132 210,135" fill="#e2e8f0" />

    <!-- Dynamic Plowing Snow Spray -->
    <path d="M 245,80 Q 280,60 300,90 Q 280,110 250,115 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="285" cy="70" r="8" fill="#ffffff" opacity="0.9" />
    <circle cx="310" cy="95" r="6" fill="#ffffff" opacity="0.85" />
    <circle cx="295" cy="115" r="7" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
